<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custome Video player application</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="video-container container-fluid pt-5 pb-4">
      <div class="row justify-content-center">
        <div class="col col-md-8 col-lg-7 col-xl-6">
          <div class="row">
            <div class="col">
              <video class="w-100 rounded-4">
                <source
                  src="https://sample-videos.com/video321/mp4/720/big_buck_bunny_720p_30mb.mp4"
                />
              </video>
            </div>
          </div>
          <div class="row __controls">
            <div class="col">
              <div class="row __progress-bar">
                <div class="col-12 py-2">
                  <div id="video-progressbar-track" class="__track w-100 rounded-5">
                    <div class="__progress-status h-100"></div>
                  </div>
                </div>
              </div>
              <div class="row __other-controls justify-content-between">
                <div class="col-12 col-md-6">
                  <div class="left-controls">
                    <button class="btn btn-sm btn-outline-secondary btn-outline" id="play_pause">
                      <i class="bi bi-play-fill"></i>
                      <i class="bi bi-pause"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" id="mute_unmute">
                      <i class="bi bi-volume-up-fill"></i>
                      <i class="bi bi-volume-mute-fill"></i>
                    </button>
                    <div id="volume-range-track" class="volume_range __track">
                      <div class="__volume_status __progress-status h-100"></div>
                    </div>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <div class="right-controls">
                    <span class="__playback_speed_selector">
                      <select
                        class="form-select form-select-sm"
                        name="play-back-speed"
                        id="playback_speed_selector"
                      >
                        <option value="0.5">Slower 0.5x</option>
                        <option value="1" selected>Normal 1x</option>
                        <option value="2">Faster 2x</option>
                        <option value="3">Faster 3x</option>
                        <option value="5">Faster 5x</option>
                      </select>
                    </span>

                    <span class="__elapsed-status">
                      <span id="elapsed-video-duration" class="__current-time">00:00</span> /
                      <span id="total-video-duration" class="__duration">00:00</span>
                    </span>

                    <span>
                      <button class="btn btn-sm btn-outline-secondary" id="fullscreen_request">
                        <i class="bi bi-fullscreen"></i>
                      </button>
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
